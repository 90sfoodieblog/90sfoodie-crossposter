name: Thread scout

on:
  schedule:
    - cron: "5 13 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Connect via Cloudflare WARP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          WGCF_URL=""
          for i in 1 2 3 4; do
            WGCF_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/ViRb3/wgcf/releases/latest | grep -o 'https://[^"]*linux_amd64[^"]*' | head -1)
            [ -n "$WGCF_URL" ] && break
            echo "wgcf lookup attempt $i came back empty, retrying..."
            sleep 15
          done
          if [ -z "$WGCF_URL" ]; then echo "wgcf download URL lookup failed"; exit 1; fi
          curl -fsSL "$WGCF_URL" -o wgcf && chmod +x wgcf
          ./wgcf register --accept-tos >/dev/null 2>&1
          ./wgcf generate >/dev/null 2>&1
          sudo install -m 600 wgcf-profile.conf /etc/wireguard/wgcf.conf
          sudo wg-quick up wgcf
          echo "--- egress check ---"
          curl -s --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)=' || true
      - name: Run thread scout
        run: python3 threadscout.py
      - name: Disconnect WARP
        if: always()
        run: sudo wg-quick down wgcf || true
      - name: Save bot state
        run: |
          git config user.name "90sfoodie-bot"
          git config user.email "90sfoodie-bot@users.noreply.github.com"
          [ -f thread_candidates.md ] && git add thread_candidates.md || true
          git diff --quiet --cached || git commit -m "Update threadscout.py state"
          git push
